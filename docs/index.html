<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClimateShield-360</title>
  <style>
    body{font-family:Georgia,serif;background:#071018;color:#E8F1F5;display:grid;place-items:center;min-height:100vh;margin:0}
    a{color:#7DD3FC}
    main{text-align:center;padding:2rem;max-width:36rem}
    h1{font-size:clamp(2rem,6vw,3.5rem);letter-spacing:.02em;margin:0 0 .75rem}
    p{line-height:1.5;opacity:.9}
  </style>
</head>
<body>
  <main>
    <h1>ClimateShield-360</h1>
    <p>Karachi extreme-weather command centre. The live app URL is published by the host workflow.</p>
    <p><a id="live" href="https://github.com/makshoof/ClimateShield-360">Open repository</a></p>
  </main>
  <script>
    fetch("https://raw.githubusercontent.com/makshoof/ClimateShield-360/live/live/URL.txt")
      .then((r) => r.ok ? r.text() : Promise.reject())
      .then((url) => {
        const clean = url.trim();
        if (!clean) return;
        const a = document.getElementById("live");
        a.href = clean;
        a.textContent = "Open ClimateShield-360 live app";
        location.replace(clean);
      })
      .catch(() => {});
  </script>
</body>
</html>
