# Free Render Blueprint — https://climateshield-360.onrender.com
services:
  - type: web
    name: climateshield-360
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/live
    envVars:
      - key: CLIMATESHIELD_DB
        value: /app/pipeline/data/processed/climateshield.duckdb
      - key: CLIMATESHIELD_AUTO_INGEST
        value: "1"
      - key: CLIMATESHIELD_INGEST_STALE_MINUTES
        value: "50"
      - key: CLIMATESHIELD_INGEST_CHECK_SECONDS
        value: "180"
      - key: CLIMATESHIELD_INGEST_STARTUP_DELAY_SECONDS
        value: "120"
      - key: PYTHONPATH
        value: /app/pipeline
      - key: PYTHONUNBUFFERED
        value: "1"

