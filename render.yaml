# Free Render Blueprint — service URL: https://climateshield-360.onrender.com
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance → this repo
services:
  - type: web
    name: climateshield-360
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: CLIMATESHIELD_DB
        value: /app/pipeline/data/processed/climateshield.duckdb
      - key: CLIMATESHIELD_AUTO_INGEST
        value: "1"
      - key: CLIMATESHIELD_INGEST_STALE_MINUTES
        value: "50"
      - key: CLIMATESHIELD_INGEST_CHECK_SECONDS
        value: "180"
      - key: PYTHONPATH
        value: /app/pipeline
      - key: PYTHONUNBUFFERED
        value: "1"
