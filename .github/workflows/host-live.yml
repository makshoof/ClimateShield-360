# Autonomous free public host — no Render/Fly/Railway API key required.
# Runs the full API + SPA on GitHub Actions and exposes it via Cloudflare quick tunnel.
# Relunches on a schedule so the URL stays available within Actions' ~6h job limit.
name: Host ClimateShield-360

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "pipeline/data/processed/climateshield.duckdb"
      - ".github/workflows/host-live.yml"
      - "Dockerfile"

concurrency:
  group: climateshield-live
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start API + SPA
        env:
          CLIMATESHIELD_DB: ${{ github.workspace }}/pipeline/data/processed/climateshield.duckdb
          CLIMATESHIELD_AUTO_INGEST: "0"
        run: |
          cd backend
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start" >&2
          tail -n 80 /tmp/api.log || true
          exit 1

      - name: Install cloudflared
        run: |
          curl -fsSL -o ./cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x ./cloudflared
          ./cloudflared --version

      - name: Open public tunnel and publish URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate > /tmp/cf.log 2>&1 &
          URL=""
          for i in $(seq 1 90); do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -n1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "Tunnel URL not found" >&2
            cat /tmp/cf.log || true
            exit 1
          fi
          echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
          echo "ClimateShield-360 live at $URL"
          mkdir -p live
          printf '%s\n' "$URL" > live/URL.txt
          printf '{"url":"%s","updated_at":"%s","service":"ClimateShield-360"}\n' \
            "$URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > live/status.json
          gh api -X PATCH "repos/${{ github.repository }}" -f homepage="$URL" || true
          {
            echo "### ClimateShield-360 is live"
            echo ""
            echo "**URL:** $URL"
            echo ""
            echo "SPA + API on the same origin. Free tunnel via Cloudflare; job refreshes ~every 5 hours."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish live branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin live 2>/dev/null || true
          git add live/URL.txt live/status.json
          if git diff --cached --quiet; then
            echo "No URL change"
          else
            git commit -m "chore: update ClimateShield-360 live URL"
          fi
          git push origin HEAD:live --force

      - name: Keep tunnel alive
        run: |
          echo "Serving ${PUBLIC_URL} for ~5.5 hours"
          sleep 330m
