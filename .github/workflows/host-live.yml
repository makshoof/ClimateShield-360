# Autonomous free public host for ClimateShield-360 (branded tunnel + live hourly data).
name: Host ClimateShield-360

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "pipeline/**"
      - "pipeline/data/processed/climateshield.duckdb"
      - ".github/workflows/host-live.yml"
      - "Dockerfile"

concurrency:
  group: climateshield-live
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            pipeline/requirements.txt

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build

      - name: Install backend + pipeline
        run: |
          pip install -r backend/requirements.txt
          pip install -r pipeline/requirements.txt

      - name: Refresh hourly warehouse before serve
        env:
          CLIMATESHIELD_DB: ${{ github.workspace }}/pipeline/data/processed/climateshield.duckdb
          PYTHONPATH: ${{ github.workspace }}/pipeline
        working-directory: ${{ github.workspace }}/pipeline
        run: |
          set -euo pipefail
          pip install -q pytz
          DB="$CLIMATESHIELD_DB"
          echo "DB bytes: $(wc -c < "$DB")"
          python - <<'PY'
          import duckdb, os
          db = os.environ["CLIMATESHIELD_DB"]
          con = duckdb.connect(db, read_only=True)
          weather = con.execute("select count(*) from weather_hourly").fetchone()[0]
          runs = con.execute("select count(*) from run_status").fetchone()[0]
          max_ts = con.execute("select cast(max(timestamp_utc) as varchar) from weather_hourly").fetchone()[0]
          print("weather_rows", weather)
          print("run_rows", runs)
          print("max_ts", max_ts)
          con.close()
          if weather < 1:
              raise SystemExit("weather_hourly is empty — cannot host live Overview")
          PY
          # Refresh only when warehouse weather is stale (>90 min). Keeps host start fast.
          NEED=$(python - <<'PY'
          import duckdb, os
          from datetime import datetime, timezone
          con = duckdb.connect(os.environ["CLIMATESHIELD_DB"], read_only=True)
          row = con.execute("select cast(max(timestamp_utc) as varchar) from weather_hourly").fetchone()[0]
          con.close()
          if not row:
              print("yes"); raise SystemExit
          # DuckDB may return offset timestamps; treat missing parse as refresh.
          try:
              ts = datetime.fromisoformat(row.replace("Z", "+00:00"))
              if ts.tzinfo is None:
                  ts = ts.replace(tzinfo=timezone.utc)
              age_min = (datetime.now(timezone.utc) - ts.astimezone(timezone.utc)).total_seconds() / 60.0
              print("yes" if age_min > 90 else "no")
              print(f"age_min={age_min:.1f}", flush=True)
          except Exception:
              print("yes")
          PY
          )
          if echo "$NEED" | head -n1 | grep -qx yes; then
            python -m climateshield ingest-hourly --once || echo "::warning::ingest-hourly failed; serving committed warehouse"
          else
            echo "Warehouse weather is fresh — skip ingest"
          fi

      - name: Start API + SPA
        env:
          CLIMATESHIELD_DB: ${{ github.workspace }}/pipeline/data/processed/climateshield.duckdb
          # Keep fetching Open-Meteo while the public host is up.
          CLIMATESHIELD_AUTO_INGEST: "1"
          CLIMATESHIELD_INGEST_STALE_MINUTES: "50"
          CLIMATESHIELD_INGEST_CHECK_SECONDS: "180"
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          cd backend
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null; then
              echo "API healthy"
              META=$(curl -sf http://127.0.0.1:8000/api/meta)
              echo "$META" | head -c 500
              echo
              STATUS=$(curl -sf http://127.0.0.1:8000/api/status)
              echo "$STATUS" | head -c 400
              echo
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start" >&2
          tail -n 120 /tmp/api.log || true
          exit 1

      - name: Open ClimateShield-360 public tunnel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer branded localtunnel subdomain; fall back to Cloudflare quick tunnel.
          npx --yes localtunnel --port 8000 --subdomain climateshield-360 > /tmp/lt.log 2>&1 &
          LT_PID=$!
          URL=""
          for i in $(seq 1 45); do
            if grep -qiE 'climateshield-360\.loca\.lt|your url is:' /tmp/lt.log; then
              URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' /tmp/lt.log | head -n1 || true)
              if [ -n "$URL" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "localtunnel branded subdomain unavailable — using Cloudflare"
            kill "$LT_PID" 2>/dev/null || true
            curl -fsSL -o ./cloudflared \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x ./cloudflared
            ./cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate > /tmp/cf.log 2>&1 &
            for i in $(seq 1 90); do
              URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -n1 || true)
              if [ -n "$URL" ]; then
                break
              fi
              sleep 2
            done
          fi
          if [ -z "$URL" ]; then
            echo "No public tunnel URL" >&2
            cat /tmp/lt.log /tmp/cf.log 2>/dev/null || true
            exit 1
          fi
          echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
          echo "ClimateShield-360 live at $URL"
          mkdir -p live docs
          printf '%s\n' "$URL" > live/URL.txt
          printf '{"url":"%s","updated_at":"%s","service":"ClimateShield-360","branded_name":"ClimateShield-360"}\n' \
            "$URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > live/status.json
          python - <<PY
          from pathlib import Path
          url = """${URL}"""
          Path("docs/index.html").write_text(
              f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0;url={url}" />
            <title>ClimateShield-360</title>
            <link rel="canonical" href="{url}" />
            <style>
              body{{font-family:Georgia,serif;background:#071018;color:#E8F1F5;display:grid;place-items:center;min-height:100vh;margin:0}}
              a{{color:#7DD3FC}}
              main{{text-align:center;padding:2rem}}
              h1{{font-size:clamp(2rem,6vw,3.5rem);letter-spacing:.02em;margin:0 0 .5rem}}
            </style>
          </head>
          <body>
            <main>
              <h1>ClimateShield-360</h1>
              <p>Opening the live command centre…</p>
              <p><a href="{url}">{url}</a></p>
            </main>
            <script>location.replace({url!r});</script>
          </body>
          </html>
          """,
              encoding="utf-8",
          )
          PY
          if echo "$URL" | grep -qi 'climateshield-360'; then
            HOME_URL="$URL"
          else
            HOME_URL="https://makshoof.github.io/ClimateShield-360/"
          fi
          gh api -X PATCH "repos/${{ github.repository }}" -f homepage="$HOME_URL" || true
          {
            echo "### ClimateShield-360 is live"
            echo ""
            echo "**App:** $URL"
            echo ""
            echo "**Branded entry:** https://makshoof.github.io/ClimateShield-360/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish live + Pages entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/URL.txt live/status.json docs/index.html
          if git diff --cached --quiet; then
            echo "No URL change"
          else
            git commit -m "chore: update ClimateShield-360 live URL"
          fi
          git push origin HEAD:live --force
          # Also publish docs/ to gh-pages for branded GitHub Pages URL
          git push origin HEAD:gh-pages --force

      - name: Keep tunnel alive with hourly ingest
        env:
          CLIMATESHIELD_DB: ${{ github.workspace }}/pipeline/data/processed/climateshield.duckdb
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          set -euo pipefail
          echo "Serving ${PUBLIC_URL} for ~5.5 hours with hourly Open-Meteo refresh"
          # Backup loop in case the in-process supervisor misses a cycle (DuckDB lock races).
          (
            END=$((SECONDS + 330 * 60))
            while [ "$SECONDS" -lt "$END" ]; do
              sleep 3600
              echo "[ingest-loop] $(date -u +%Y-%m-%dT%H:%M:%SZ) starting hourly ingest"
              (
                cd "${{ github.workspace }}/pipeline"
                python -m climateshield ingest-hourly --once
              ) >> /tmp/ingest-loop.log 2>&1 || echo "[ingest-loop] ingest failed (will retry next hour)"
              curl -sf http://127.0.0.1:8000/api/status | head -c 300 || true
              echo
            done
          ) &
          LOOP_PID=$!
          sleep 330m
          kill "$LOOP_PID" 2>/dev/null || true
          echo "---- ingest-loop tail ----"
          tail -n 40 /tmp/ingest-loop.log || true
          echo "---- api log tail ----"
          tail -n 40 /tmp/api.log || true
