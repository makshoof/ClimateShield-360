# Ping Render free tier so the instance stays awake and hourly ingest keeps running.
name: Keep Render awake
on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm climateshield-360.onrender.com
        run: |
          set -e
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/cs_body -w "%{http_code}" --connect-timeout 30 --max-time 90 \
              "https://climateshield-360.onrender.com/api/live" || true)
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ]; then
              cat /tmp/cs_body
              exit 0
            fi
            sleep 20
          done
          echo "Render not reachable yet (build may still be running)"
          exit 0
